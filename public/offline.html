<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>SiraLex — Hors connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f5f0;
        color: #16213a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
      }
      h1 {
        color: #0b2740;
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #16213a99;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        background: #123a5e;
        color: #fff;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 6px;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Vous êtes hors connexion</h1>
      <p>
        SiraLex a besoin d'une connexion internet pour charger cette page.
        Vérifiez votre connexion puis réessayez.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
